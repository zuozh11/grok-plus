name: Release grok-plus

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "README.md"
      - "install.sh"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to release
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: grok-plus-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Prepare version
        id: version
        shell: bash
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          version="1.1.$epoch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install DotSlash
        run: cargo install dotslash --locked

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}-

      - name: Build
        env:
          GROK_VERSION: ${{ steps.version.outputs.version }}
          CARGO_INCREMENTAL: "0"
        run: cargo build --release -p xai-grok-pager-bin --bin grok-plus

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/package
          cp target/release/grok-plus dist/package/grok-plus
          printf '%s\n' "$VERSION" > dist/package/VERSION
          tar -C dist/package -czf dist/grok-plus-aarch64-apple-darwin.tar.gz grok-plus VERSION
          (cd dist && shasum -a 256 grok-plus-aarch64-apple-darwin.tar.gz > grok-plus-aarch64-apple-darwin.tar.gz.sha256)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            dist/grok-plus-aarch64-apple-darwin.tar.gz \
            dist/grok-plus-aarch64-apple-darwin.tar.gz.sha256 \
            --latest \
            --title "grok-plus $VERSION" \
            --notes "Automated build from commit $(git rev-parse HEAD)."

      - name: Notify successful update
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          issue_url="$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "grok-plus $VERSION 已发布" \
            --body "@zuozh11 grok-plus $VERSION 已自动编译并发布，本地自动更新器将在六小时内安装。")"
          gh issue close "${issue_url##*/}" --repo "$GITHUB_REPOSITORY" --reason completed
